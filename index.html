<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Contatos de formador 2027 · Curem</title>
<style>
:root{color-scheme:light;--bg:#f4f5f7;--panel:#fff;--ink:#1c2430;--muted:#5f6b7a;--line:#dfe3e8;--soft:#eef1f4;--ok:#1F8A70;--bu:#B7791F;--red:#C0392B;--blue:#2F6FB3}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:12px max(2vw,12px) 40px}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.ttl{display:flex;flex-direction:column;margin-right:auto}.ttl b{font-size:18px}.ttl span{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 13px;min-height:38px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--ink)}.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn svg{vertical-align:-3px;margin-right:5px}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:10px}
.k{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.k b{display:block;font-size:28px;line-height:1.1}.k span{display:block;font-weight:700;font-size:14px}.k i{font-style:normal;font-size:12.5px;color:var(--muted)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 0 6px;margin-bottom:10px}
.h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:12px 14px 4px}.h b{font-size:16px}.h span{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;padding:2px 10px 6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:8px 22px;padding:12px 8px;border-bottom:1px solid var(--line);border-radius:8px}
.row:last-child{border-bottom:0}.row.ok{background:color-mix(in srgb,var(--ok) 9%,transparent)}.row.bu{background:color-mix(in srgb,var(--bu) 10%,transparent)}
.fa{display:flex;flex-direction:column;gap:3px;font-size:14px}.m{font-size:12.5px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:4px}.pill{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--soft)}
.pill.c-ambos{background:color-mix(in srgb,#1F8A70 20%,transparent)}.pill.c-c1,.pill.c-c2{background:color-mix(in srgb,#2F6FB3 18%,transparent)}.pill.c-an{background:color-mix(in srgb,#8E44AD 16%,transparent)}.pill.c-und{background:color-mix(in srgb,#B7791F 18%,transparent)}
.ac{display:flex;flex-direction:column;gap:7px}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.lb{font-size:12.5px;font-weight:700;color:var(--muted);margin-right:2px}
.vb{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;min-height:38px;font-size:13.5px;font-weight:700;cursor:pointer}
.vb:hover{border-color:var(--ink)}.vb.on{background:var(--ink);border-color:var(--ink);color:#fff}
.vb.bu{margin-left:6px}.vb.bu.on{background:var(--bu);border-color:var(--bu)}
.vb.vc:not(.on){border-style:dashed}
.in{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;background:var(--panel)}
.sel{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end}.sel label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
.sel select{font-size:14px;padding:6px 8px;min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.lk{font-size:13px;padding-bottom:9px;color:var(--muted)}.lk.y{color:var(--ink);font-weight:700}
.none{padding:10px 8px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;padding:10px 12px}
.card{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.card:hover,.card:focus-within{border-color:var(--ink)}
.cm{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;border:0;background:none;padding:14px;cursor:pointer;border-radius:12px}
.cn{font-weight:800;font-size:16px;padding-right:44px}.cs{font-size:12.5px;color:var(--muted)}.cs b{color:var(--ink)}
.prog{display:block;height:6px;border-radius:99px;background:var(--soft);overflow:hidden}.prog i{display:block;height:100%;background:var(--ok)}
.cp{position:absolute;top:8px;right:8px;width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;background:var(--panel);cursor:pointer}
.cp:hover{border-color:var(--ink)}.cp.ok{background:var(--ok);border-color:var(--ok);color:#fff}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:9px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 24px)}#toast.on{opacity:1}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:620px;margin:40px auto}.msg b{display:block;font-size:18px;margin-bottom:6px}
textarea{width:100%;min-height:160px;border:1px solid var(--line);border-radius:8px;padding:8px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
#tour{position:fixed;inset:0;z-index:50}#tour.dim{background:rgba(15,23,42,.55)}
.tr-hole{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(15,23,42,.55);outline:2px solid #fff;pointer-events:none}
.tr-box{position:fixed;background:var(--panel);border-radius:12px;padding:16px 16px 12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tr-box b{display:block;font-size:16px;margin-bottom:6px}.tr-box p{margin:0 0 12px;font-size:14px}
.tr-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.tr-f span{margin-right:auto;font-size:12px;color:var(--muted)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.row{grid-template-columns:minmax(0,1fr)}.vb.bu{margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
<div class="bar" id="bar"><div class="ttl"><b>Contatos de formador 2027</b><span>Inside Sales Curem</span></div></div>
<div id="kpis"></div>
<div id="app"><div class="msg"><b>Carregando…</b></div></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
{
const ST=['Turma fechada','Inscrições abertas','Link liberado / em liberação','Aguardando local ou aprovação','Grupo em formação','Em negociação','Travada / em risco'];
const LINKST=ST.slice(0,3);
const VALOPT=[['c1','1º sem'],['c2','2º sem'],['ambos','1º e 2º'],['anual','Anual']];
const VSEM=[['','A definir'],['c1','1º sem'],['c2','2º sem'],['ambos','1º e 2º sem']];
const CAT={ambos:'1º e 2º sem',c1:'Só 1º sem',c2:'Só 2º sem',an:'Anual (turma única)',und:'Semestre a definir',sem:'Sem contato'};
const ICOPY='<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const int=n=>Number(n||0).toLocaleString('pt-BR');
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'0%';
const when=t=>{if(!t)return '';const d=new Date(t);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});};
const HP=new URLSearchParams(location.hash.slice(1));
const TOKEN=HP.get('v')||HP.get('a')||'';
let D=null,VIEW='',TS=-1,busy=0;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('on'),2600);}
async function api(op,body){const o={headers:{'x-token':TOKEN}};if(body){o.method='POST';o.headers['Content-Type']='application/json';o.body=JSON.stringify(body);}
  const r=await fetch('/api?op='+op,o);const j=await r.json().catch(()=>({erro:'Resposta inválida do servidor'}));if(!r.ok)throw new Error(j.erro||('Erro '+r.status));return j;}
const SN=id=>{const s=D.sellers.find(x=>x.id===id);return s?s.name:id;};
function st(x){const m=D.marks[x.k]||{},c=m.c150||{};
  const inC='on' in c?c.on:!!x.c150;const c1='c1' in c?c.c1:!!x.c1,c2='c2' in c?c.c2:!!x.c2;const stv='st' in c?c.st:(x.st||'');
  const v=m.conf&&m.conf.v||'';const base=!!x.em||inC;const has=base||['c1','c2','ambos','anual'].includes(v);
  const sec=c.val&&inC?(c.de==='com'?'com':'sem'):inC?'camp':x.em?'com':'sem';
  return {m,c,inC,c1,c2,stv,v,has,busca:v==='busca'&&!base,sec,cobs:'obs' in c?c.obs:(x.cobs||''),cv:c.v||x.v||'',link:LINKST.includes(stv)};}
const linkTxt=s=>['Turma fechada','Inscrições abertas'].includes(s)?'Sim':s==='Link liberado / em liberação'?'Sim (ou em liberação)':s?'Não':'—';
function stats(L){const S=L.map(x=>({x,s:st(x)}));const sem0=S.filter(o=>o.s.sec==='sem');
  return {S,sem0,tot:L.length,com:S.filter(o=>o.s.has).length,c150:S.filter(o=>o.s.inC).length,link:S.filter(o=>o.s.inC&&o.s.link).length,sem:S.filter(o=>!o.s.has).length,busca:S.filter(o=>o.s.busca).length,
    val:sem0.filter(o=>o.s.v||o.s.m.obs||o.s.inC).length,novo:sem0.filter(o=>o.s.has).length};}
const facOf=id=>D.fac.filter(f=>f.own.includes(id));
function bar(){const adm=D.role==='admin';const who=adm?(VIEW?SN(VIEW):'Administração'):SN(D.seller);
  $('bar').innerHTML=`<div class="ttl"><b>Contatos de formador 2027</b><span>${esc(who)} · Inside Sales Curem</span></div>`+
   (adm&&VIEW?`<button class="btn" id="back">← Todos os vendedores</button><button class="btn" data-copy="${esc(VIEW)}">${ICOPY}Copiar link do vendedor</button>`:'')+
   (adm&&!VIEW?`<button class="btn" id="exp">Exportar marcações</button>`:'')+
   (VIEW||!adm?`<button class="btn" id="tourBtn">Como preencher</button>`:'');}
function render(){
  if(!D)return;
  if(D.vazio){$('kpis').innerHTML='';$('app').innerHTML=D.role==='admin'?`<div class="msg"><b>Importar dados</b><p class="m">Cole o JSON de importação ({ sellers, fac }).</p><textarea id="impTxt"></textarea><p><button class="btn pri" id="impBtn">Importar</button></p></div>`:`<div class="msg"><b>Ainda não há dados</b><p class="m">A lista ainda está sendo preparada. Tente de novo em alguns minutos.</p></div>`;return;}
  bar();
  if(D.role==='admin'&&!VIEW)return renderAdmin();
  renderSeller(D.role==='admin'?VIEW:D.seller);}
function renderAdmin(){const T=stats(D.fac);
  const k=(b,l,s)=>`<div class="k"><b>${b}</b><span>${l}</span><i>${s}</i></div>`;
  $('kpis').innerHTML=`<div class="kpis">${k(int(T.tot),'Faculdades','todas as carteiras')}${k(int(T.com),'Com contato',pct(T.com,T.tot))}${k(int(T.c150),'Campanha 150',int(T.link)+' com link')}${k(int(T.sem),'Sem contato',T.busca?int(T.busca)+' buscando contato':'para validar')}${k(int(T.val)+' de '+int(T.sem0.length),'Respondidas',T.novo?int(T.novo)+' passaram a ter contato':'pelos vendedores ou na validação')}</div>`;
  const cards=D.sellers.map(s=>({s,t:stats(facOf(s.id))})).filter(o=>o.t.tot);
  $('app').innerHTML=`<div class="box"><div class="h"><b>Vendedores</b><span>Clique para abrir a carteira; o ícone copia o link do vendedor.</span></div><div class="grid">${cards.map(({s,t})=>{const p=t.sem0.length?Math.round(t.val/t.sem0.length*100):100;
    return `<div class="card"><button class="cm" data-open="${esc(s.id)}"><span class="cn">${esc(s.name)}</span><span class="cs"><b>${int(t.sem0.length)}</b> sem contato no mapeamento · <b>${int(t.c150)}</b> na Campanha 150</span><span class="prog"><i style="width:${p}%"></i></span><span class="cs">${int(t.val)} de ${int(t.sem0.length)} respondidas${t.novo?' · '+int(t.novo)+(t.novo===1?' passou':' passaram')+' a ter contato':''}</span></button>
    <button class="cp" data-copy="${esc(s.id)}" aria-label="Copiar link de ${esc(s.name)}" title="Copiar link de ${esc(s.name)}">${ICOPY}</button></div>`;}).join('')}</div></div>`;}
function renderSeller(id){
  const keep=keepFocus();
  const L=facOf(id),T=stats(L);
  const k=(b,l,s)=>`<div class="k"><b>${b}</b><span>${l}</span><i>${s}</i></div>`;
  $('kpis').innerHTML=`<div class="kpis">${k(int(T.tot),'Carteira',esc(SN(id)))}${k(int(T.com),'Com contato',pct(T.com,T.tot)+' das faculdades')}${k(int(T.c150),'Campanha 150',int(T.link)+' com link')}${k(int(T.sem),'Sem contato',T.busca?int(T.busca)+' buscando contato':'para validar')}${k(int(T.val)+' de '+int(T.sem0.length),'Respondidas',T.novo?int(T.novo)+(T.novo===1?' passou':' passaram')+' a ter contato':'nesta carteira')}</div>`;
  const byFo=(a,b)=>(+b.x.fo||0)-(+a.x.fo||0)||a.x.n.localeCompare(b.x.n);
  const sem=T.S.filter(o=>o.s.sec==='sem').sort(byFo);
  const camp=T.S.filter(o=>o.s.sec==='camp').sort((a,b)=>{const ia=ST.indexOf(a.s.stv),ib=ST.indexOf(b.s.stv);return (ia<0?99:ia)-(ib<0?99:ib)||byFo(a,b);});
  const com=T.S.filter(o=>o.s.sec==='com').sort(byFo);
  const shared=x=>{const o=x.own.filter(z=>z!==id).map(SN);return o.length?' · compartilhada com '+o.join(' e '):'';};
  const fac=x=>`<div class="fa"><div><b>${esc(x.sg||'')}</b> ${esc(x.n)}</div><div class="m">${esc(x.c)} · ${esc(x.uf)}${x.fo?' · '+int(x.fo)+' formandos/ano':''}${esc(shared(x))}</div>`;
  const ctl=(x,s)=>{const sv=s.c1&&s.c2?'ambos':s.c1?'c1':s.c2?'c2':'';const lk=linkTxt(s.stv);
    return `<div class="sel"><label>Semestre 2027<select data-sem="${esc(x.k)}">${VSEM.map(([a,l])=>`<option value="${a}"${sv===a?' selected':''}>${l}</option>`).join('')}</select></label>
    <label>Situação<select data-st="${esc(x.k)}"><option value=""${!s.stv?' selected':''}>—</option>${ST.map(t=>`<option${s.stv===t?' selected':''}>${esc(t)}</option>`).join('')}</select></label><span class="lk${lk.startsWith('Sim')?' y':''}">Link: ${esc(lk)}</span></div>`;};
  const tog=(x,s,de)=>`<div class="seg"><span class="lb">Campanha 150:</span><button class="vb vc${s.inC?' on':''}" data-tog="${esc(x.k)}" data-de="${de}" aria-pressed="${s.inC}">${s.inC?'✓ Está na campanha':'Marcar: está na campanha'}</button>${s.inC&&s.c.val?`<span class="m">${s.c.por==='vendedor'?'marcada pelo vendedor':'marcada na validação'}</span>`:''}</div>`;
  const semRow=({x,s})=>{const cls=s.has?' ok':s.busca?' bu':'';const c=s.m.conf;
    return `<div class="row${cls}">${fac(x)}${x.hint&&x.hint.length?`<div class="pills">${x.hint.map(h=>`<span class="pill">${esc(h)}</span>`).join('')}</div>`:''}${x.det?`<div class="m">${esc(x.det)}</div>`:''}</div>
    <div class="ac"><div class="seg" role="group" aria-label="Contato 2027 de ${esc(x.sg||x.n)}"><span class="lb">Tem contato:</span>${VALOPT.map(([a,l])=>`<button class="vb${s.v===a?' on':''}" data-conf="${esc(x.k)}" data-v="${a}" aria-pressed="${s.v===a}">${l}</button>`).join('')}<button class="vb bu${s.v==='busca'?' on':''}" data-conf="${esc(x.k)}" data-v="busca" aria-pressed="${s.v==='busca'}">Buscando contato</button></div>
    ${tog(x,s,'sem')}${s.inC?ctl(x,s):''}
    <input class="in" data-obs="${esc(x.k)}" value="${esc(s.m.obs||'')}" placeholder="Observação (com quem falou, próxima ação)" aria-label="Observação sobre ${esc(x.sg||x.n)}">
    <div class="m">${c&&c.v?(c.por==='vendedor'?'Marcado pelo vendedor em ':'Marcado na validação em ')+when(c.em):'Ainda sem marcação'}${s.m.obs&&s.m.obsEm?' · observação em '+when(s.m.obsEm):''}</div></div></div>`;};
  const campRow=({x,s})=>`<div class="row">${fac(x)}<div class="m">${s.cv?'Vendedor da campanha: '+esc(s.cv)+' · ':''}Fase no CRM: ${esc(x.crm||'não verificada')}</div></div>
    <div class="ac">${tog(x,s,'camp')}${ctl(x,s)}<input class="in" data-cobs="${esc(x.k)}" value="${esc(s.cobs)}" placeholder="Observação da campanha" aria-label="Observação da Campanha 150 sobre ${esc(x.sg||x.n)}"></div></div>`;
  const comRow=({x,s})=>`<div class="row${s.inC?' ok':''}">${fac(x)}<div class="m">Contato: ${esc(x.src||'CRM')} · <span class="pill c-${esc(x.cat)}">${esc(CAT[x.cat]||'')}</span></div></div><div class="ac">${tog(x,s,'com')}${s.inC?ctl(x,s):''}</div></div>`;
  $('app').innerHTML=`<div class="box"><div class="h" id="sec-sem"><b>Faculdades sem contato registrado</b><span>${int(sem.length)} · as maiores primeiro. “Tem contato” passa a contar como contato 2027; “Buscando contato” continua como sem contato.</span></div><div class="list">${sem.map(semRow).join('')||'<p class="none">Nenhuma faculdade sem contato nesta carteira.</p>'}</div></div>
   <div class="box"><div class="h" id="sec-camp"><b>Campanha 150 · revisar</b><span>${int(camp.length)} · semestre, situação e observação. Desmarcar tira a faculdade da campanha.</span></div><div class="list">${camp.map(campRow).join('')||'<p class="none">Nenhuma faculdade desta carteira na Campanha 150.</p>'}</div></div>
   <div class="box"><div class="h" id="sec-com"><b>Com contato, fora da Campanha 150</b><span>${int(com.length)} · marque se alguma já estiver na campanha.</span></div><div class="list">${com.map(comRow).join('')||'<p class="none">Nenhuma faculdade nesta situação.</p>'}</div></div>`;
  restoreFocus(keep);}
function keepFocus(){const a=document.activeElement;if(a&&a.dataset&&(a.dataset.obs||a.dataset.cobs)){const at=a.dataset.obs?'obs':'cobs';return {sel:`[data-${at}="${CSS.escape(a.dataset[at])}"]`,v:a.value,s:a.selectionStart,e:a.selectionEnd};}return null;}
function restoreFocus(k){if(!k)return;const el=document.querySelector(k.sel);if(el){el.value=k.v;el.focus();try{el.setSelectionRange(k.s,k.e);}catch(_){}}}
async function mark(body,msg){busy++;try{const r=await api('mark',body);D.marks[r.k]=r.mark;render();toast(msg);}catch(e){toast(e.message);}finally{busy--;}}
const nameOf=k=>{const f=D.fac.find(x=>x.k===k);return f?(f.sg||f.n):'Faculdade';};
async function copyLink(id){const t=D.links&&D.links[id];if(!t){toast('Link ainda não gerado');return;}const u=location.origin+'/#v='+t;
  try{await navigator.clipboard.writeText(u);toast('Link de '+SN(id)+' copiado');return true;}catch(e){window.prompt('Copie o link de '+SN(id)+':',u);}}
document.addEventListener('click',async e=>{const t=e.target;
  const cf=t.closest('[data-conf]');if(cf){const k=cf.dataset.conf,v=cf.dataset.v;const cur=st(D.fac.find(x=>x.k===k)).v;const nv=cur===v?'':v;mark({k,conf:nv},nameOf(k)+': '+(nv?cf.textContent.trim():'marcação removida'));return;}
  const tg=t.closest('[data-tog]');if(tg){const k=tg.dataset.tog;const s=st(D.fac.find(x=>x.k===k));if(s.inC&&!confirm('Tirar '+nameOf(k)+' da Campanha 150?'))return;mark({k,c150:{on:!s.inC,de:tg.dataset.de}},nameOf(k)+': '+(s.inC?'retirada da Campanha 150':'marcada na Campanha 150'));return;}
  const op=t.closest('[data-open]');if(op){VIEW=op.dataset.open;render();scrollTo(0,0);return;}
  const cp=t.closest('[data-copy]');if(cp){if(await copyLink(cp.dataset.copy)){cp.classList.add('ok');setTimeout(()=>cp.classList.remove('ok'),1500);}return;}
  if(t.closest('#back')){VIEW='';render();scrollTo(0,0);return;}
  if(t.closest('#tourBtn')){tourOpen();return;}
  if(t.closest('#exp')){try{const r=await api('export');const ta=document.createElement('textarea');ta.value=JSON.stringify(r);$('app').prepend(ta);ta.select();try{await navigator.clipboard.writeText(ta.value);toast('Marcações copiadas');}catch(_){toast('Selecione e copie o texto');}}catch(err){toast(err.message);}return;}
  if(t.closest('#impBtn')){try{const r=await api('import',JSON.parse($('impTxt').value));toast(r.faculdades+' faculdades importadas');load();}catch(err){toast(err.message);}}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset||{};
  if(d.obs){const k=d.obs,v=t.value.trim();if(v===((D.marks[k]||{}).obs||''))return;mark({k,obs:v},nameOf(k)+': observação salva');return;}
  if(d.sem){const v=t.value;mark({k:d.sem,c150:{c1:v==='c1'||v==='ambos',c2:v==='c2'||v==='ambos'}},nameOf(d.sem)+': semestre salvo');return;}
  if(d.st){mark({k:d.st,c150:{st:t.value}},nameOf(d.st)+': situação salva');return;}
  if(d.cobs){const k=d.cobs,v=t.value.trim();if(v===st(D.fac.find(x=>x.k===k)).cobs)return;mark({k,c150:{obs:v}},nameOf(k)+': observação salva');}});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key==='Enter'&&t.classList&&t.classList.contains('in')){e.preventDefault();t.blur();}
  if(TS<0)return;if(e.key==='Escape'){e.preventDefault();tourClose();}else if(e.key==='ArrowRight'){e.preventDefault();tourNext();}else if(e.key==='ArrowLeft'&&TS>0){e.preventDefault();TS--;tourShow();}});
const TOUR=[
  {t:'Olá, {v}!',d:'Aqui você atualiza o status das suas faculdades para 2027: se tem o contato do formador e se a faculdade está na Campanha 150. Tudo é salvo na hora, sem botão de salvar.'},
  {s:'#kpis',t:'Seus números',d:'Carteira, faculdades com contato, Campanha 150 e sem contato. Os números mudam conforme você marca.'},
  {s:'#sec-sem',t:'Faculdades sem contato registrado',d:'Esta é a lista principal: faculdades da sua carteira em que o CRM e a Campanha 150 não mostram contato do formador para 2027. As maiores aparecem primeiro.'},
  {s:'#sec-sem+.list .seg',t:'Tem o contato?',d:'Se você tem o contato do formador da turma 2027, marque o semestre: 1º, 2º, os dois ou anual. Clicar de novo no mesmo botão desmarca.'},
  {s:'#sec-sem+.list .vb.bu',t:'Ainda buscando?',d:'Se ainda não tem o contato, mas está correndo atrás, marque Buscando contato.'},
  {s:'#sec-sem+.list [data-tog]',t:'Está na Campanha 150?',d:'Se a faculdade já está na Campanha 150, marque aqui. Logo abaixo aparecem semestre e situação para você preencher.'},
  {s:'#sec-sem+.list [data-obs]',t:'Observação',d:'Escreva o que ajuda a equipe: com quem falou, próxima ação, data. Aperte Enter ou clique fora para salvar.'},
  {s:'#sec-camp',t:'Faculdades na campanha',d:'Revise semestre, situação e observação das faculdades que já estão na Campanha 150.'},
  {s:'#sec-com',t:'Com contato, fora da campanha',d:'Faculdades em que já existe contato pelo CRM. Marque se alguma já estiver na Campanha 150.'},
  {t:'Pronto!',d:'É só isso. Volte a este link sempre que algo mudar. O botão Como preencher, no alto da página, repete este passo a passo.'}];
function tourOpen(){TS=0;tourShow();}
function tourNext(){if(TS>=TOUR.length-1)tourClose();else{TS++;tourShow();}}
function tourClose(){TS=-1;const o=$('tour');if(o)o.remove();try{localStorage.setItem('c27tour','1');}catch(e){}}
function tourShow(){let o=$('tour');
  if(!o){o=document.createElement('div');o.id='tour';o.innerHTML='<div class="tr-hole"></div><div class="tr-box" role="dialog" aria-modal="true" aria-labelledby="trT"><b id="trT"></b><p id="trD"></p><div class="tr-f"><span id="trN"></span><button class="btn" id="trSkip">Pular</button><button class="btn" id="trPrev">Voltar</button><button class="btn pri" id="trNext">Próximo</button></div></div>';document.body.appendChild(o);
    o.addEventListener('click',e=>{if(e.target.closest('#trSkip'))tourClose();else if(e.target.closest('#trPrev')){if(TS>0){TS--;tourShow();}}else if(e.target.closest('#trNext'))tourNext();});}
  const s=TOUR[TS];const sl=D.sellers.find(x=>x.id===(VIEW||D.seller));const nm=sl?(sl.first||sl.name.split(' ')[0]):'';
  $('trT').textContent=s.t.replace('{v}',nm).replace(', !','!');$('trD').textContent=s.d;$('trN').textContent=(TS+1)+' de '+TOUR.length;$('trPrev').disabled=TS===0;$('trNext').textContent=TS===TOUR.length-1?'Começar':'Próximo';
  const el=s.s?document.querySelector(s.s):null;const hole=o.querySelector('.tr-hole'),box=o.querySelector('.tr-box');o.classList.toggle('dim',!el);
  const place=()=>{const W=innerWidth,H=innerHeight,bw=Math.min(380,W-24);box.style.width=bw+'px';const bh=box.offsetHeight;
    if(!el){hole.style.display='none';box.style.left=((W-bw)/2)+'px';box.style.top=Math.max(12,(H-bh)/2)+'px';return;}
    const r=el.getBoundingClientRect();const t=Math.max(4,r.top-6),b=Math.min(H-4,r.bottom+6);
    hole.style.cssText=`display:block;left:${Math.max(4,r.left-6)}px;top:${t}px;width:${Math.min(W-8,r.width+12)}px;height:${Math.max(20,b-t)}px`;
    let y=b+12;if(y+bh>H-12)y=t-12-bh;if(y<12)y=Math.max(12,H-bh-12);box.style.left=Math.min(Math.max(12,r.left),W-bw-12)+'px';box.style.top=y+'px';};
  if(el){el.scrollIntoView({block:'center'});requestAnimationFrame(()=>requestAnimationFrame(place));}else place();
  setTimeout(()=>{const n=$('trNext');if(n)n.focus();},40);}
addEventListener('resize',()=>{if(TS>=0)tourShow();});
async function load(){try{D=await api('me');render();
    if(D.role==='seller'&&!D.vazio){let seen=false;try{seen=localStorage.getItem('c27tour')==='1';}catch(e){}if(!seen&&TS<0)setTimeout(tourOpen,400);}}
  catch(e){$('kpis').innerHTML='';$('app').innerHTML=`<div class="msg"><b>Não foi possível abrir</b><p class="m">${esc(e.message)}</p></div>`;}}
async function refresh(){if(!D||busy||TS>=0)return;const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;try{const n=await api('me');D=n;render();}catch(e){}}
addEventListener('hashchange',()=>location.reload());
if(!TOKEN){$('app').innerHTML='<div class="msg"><b>Link incompleto</b><p class="m">Abra o link completo que você recebeu no Teams.</p></div>';}
else{load();setInterval(refresh,60000);}
}
</script>
</body>
